---
name: "Run Bork locally with shell"
command: "BORK_SHELL_PATH={{shell}} cargo run"
description: "Runs bork with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Bork Team
shells: []
