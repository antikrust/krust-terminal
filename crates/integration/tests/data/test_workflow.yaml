---
name: "Run Derp locally with shell"
command: "DERP_SHELL_PATH={{shell}} cargo run"
description: "Runs derp with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Derp Team
shells: []
