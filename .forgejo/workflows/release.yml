# Release: fires on a version tag (v*). Each lane builds Release and bundles
# with Krust's existing script/{linux,windows}/bundle tooling, attaches its
# artifacts to a Forgejo release on the tag, and the linux lane finally rsyncs
# everything (incl. the locally-built macOS dmg, if present) to the website.
#
# macOS note: there is no Forgejo mac runner -- the mac is the local main build.
# Build the dmg locally with `script/macos/bundle -c oss` and either attach it to
# the release in the UI, or drop it under dist/macos/ on the linux runner's
# checkout before the upload step (see KRUST_MAC_DMG below).
#
# A tag containing "-test" does everything EXCEPT the website upload -- use e.g.
# v0.0.1-test to rehearse a release without touching the live site.
name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows
    defaults:
      run:
        shell: powershell
    steps:
      - name: free disk space
        run: |
          # Only one drive on this runner (C:, ~64G total) with no data disk
          # to redirect CARGO_TARGET_DIR to (unlike the linux runner's
          # /mnt/terra). Every past run's target dir sits under its own
          # hash-named act workdir and is never cleaned up, so stale ones
          # from earlier CI runs just accumulate. Reclaim that before it
          # starves the current run of space during LTO codegen (the actual
          # cause of the "not enough space on the disk" failure here).
          $ErrorActionPreference = 'Continue'
          Get-ChildItem -Path "C:\w\.cache\act" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $t = Join-Path $_.FullName "hostexecutor\target"
            if (Test-Path $t) {
              Write-Output "Removing stale target dir: $t"
              Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue
            }
          }
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String -Width 200
      - name: checkout
        run: |
          git init -q .
          git fetch -q https://x-access-token:${{ github.token }}@shithub.space/${{ github.repository }}.git ${{ github.sha }}
          git checkout -q --force FETCH_HEAD
      - name: ensure rust
        run: |
          # cargo/rustup write routine progress to stderr; under this runner's
          # remoting model that gets wrapped as a terminating error (category
          # RemoteException) whenever $ErrorActionPreference is 'Stop' (which
          # the runner sets by default for every step). Same fix as build.yml.
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable
          }
          # Needed for proto codegen in build.rs (prost-build). Mirrored under
          # our own infra rather than fetched from github.com/releases, same
          # reasoning as script/linux/install_build_deps.
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://derp.baby/vendor/protoc-25.1-win64.zip" -OutFile protoc.zip -TimeoutSec 60
            Expand-Archive -Path protoc.zip -DestinationPath "$env:USERPROFILE\protoc" -Force
          }
      - name: bundle
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:USERPROFILE\protoc\bin;$env:PATH"
          .\script\windows\bundle.ps1 -CHANNEL oss -RELEASE_TAG "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: attach to release
        run: |
          $T = "${{ github.token }}"
          $H = @{ Authorization = "token $T" }
          $api = "https://shithub.space/api/v1/repos/${{ github.repository }}"
          # Create the release if it does not exist yet (first lane to finish wins).
          try { Invoke-RestMethod -Method Post -Headers $H -ContentType "application/json" `
                -Body (@{ tag_name = $env:GITHUB_REF_NAME; name = $env:GITHUB_REF_NAME } | ConvertTo-Json) `
                -Uri "$api/releases" | Out-Null } catch {}
          $rel = Invoke-RestMethod -Headers $H -Uri "$api/releases/tags/$env:GITHUB_REF_NAME"
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in ".exe",".msi",".zip" -and $_.FullName -match "\\(dist|bundle|installer)\\" } | ForEach-Object {
            # Replace rather than duplicate a same-named asset from an earlier run.
            $name = $_.Name
            (Invoke-RestMethod -Headers $H -Uri "$api/releases/$($rel.id)/assets") | Where-Object { $_.name -eq $name } | ForEach-Object {
              Invoke-RestMethod -Method Delete -Headers $H -Uri "$api/releases/$($rel.id)/assets/$($_.id)" | Out-Null
            }
            curl.exe -sf -X POST -H "Authorization: token $T" -F "attachment=@$($_.FullName)" `
              "$api/releases/$($rel.id)/assets?name=$($_.Name)" | Out-Null
            $_.Name
          }

  linux:
    runs-on: linux
    # No `needs: windows` -- the windows runner (bob-winbuild) is occasionally
    # offline, and linux/mac artifacts should still ship without waiting on it.
    # Windows assets get picked up whenever that lane next completes (the
    # "gather" step below just finds zero if none exist yet).
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q https://x-access-token:${{ github.token }}@shithub.space/${{ github.repository }}.git ${{ github.sha }}
          git checkout -q --force FETCH_HEAD
      - name: ensure rust
        run: |
          command -v cargo >/dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          }
          export PATH="$HOME/.cargo/bin:$PATH"
          # Needed for the bundle's third-party-license generation step.
          command -v cargo-about >/dev/null || cargo install cargo-about --features cli
          # Needed for the AppImage package -- script/linux/bundle tries
          # appimage first (before deb/rpm) and the script has `set -e`, so
          # without this the whole bundle aborts before deb/rpm ever build.
          # install_build_deps doesn't call this itself; it's normally a
          # separate manual setup step, so CI has to invoke it explicitly.
          ./script/linux/install_linuxdeploy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Needed for the .rpm package -- install_build_deps only pulls in
          # apt/cargo deps needed to *compile*, not rpmbuild (only relevant
          # for packaging on this Debian-based runner).
          command -v rpmbuild >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rpm; }
          # The default target dir (under the act workdir, on the root disk)
          # has almost no headroom on this runner -- point cargo at the big
          # data disk instead. This was the real, persistent cause of the
          # repeated "No space left on device" failures, not /mnt/terra
          # (which only mattered for tmp files and the swapfile). Written to
          # GITHUB_ENV (not just exported here) so later steps -- notably the
          # artifact-finding `find` below -- see it too; a plain `export`
          # inside one step's `run:` does not carry over to the next step.
          echo "CARGO_TARGET_DIR=/mnt/terra/forgejo-ci/cargo-target" >> "$GITHUB_ENV"
      - name: bundle
        run: |
          set -o pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # Full parallelism exhausts this runner's 31G RAM + swap during
          # release+LTO codegen/linking (repeatedly OOM-killed rustc even with
          # 16G extra swap added). Trade build time for actually completing.
          export CARGO_BUILD_JOBS=2
          # CARGO_TARGET_DIR persists across runs on this runner, so packages
          # from earlier releases (e.g. the old bork-terminal_* ones) would
          # otherwise be collected and published again by the attach step.
          # Clear them so only this run's output exists.
          find "${CARGO_TARGET_DIR:-/nonexistent}" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' \) \
            -print -delete 2>/dev/null || true
          ./script/linux/bundle -c oss --release-tag "${GITHUB_REF_NAME}" --packages deb,rpm,appimage 2>&1 | tee /tmp/krust-release.log
      - name: report failure as an issue
        if: failure()
        run: |
          body=$(tail -c 60000 /tmp/krust-release.log | jq -Rs .)
          curl -sf -X POST -H "Authorization: token ${{ github.token }}" -H "Content-Type: application/json" \
            -d "{\"title\": \"CI failure: linux release bundle @ ${{ github.sha }}\", \"body\": $body}" \
            "https://shithub.space/api/v1/repos/${{ github.repository }}/issues" || true
      - name: attach linux artifacts to release
        run: |
          T="${{ github.token }}"
          api="https://shithub.space/api/v1/repos/${{ github.repository }}"
          # Create the release if the windows lane somehow hasn't yet.
          curl -sf -H "Authorization: token $T" "$api/releases/tags/$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            curl -sf -X POST -H "Authorization: token $T" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$GITHUB_REF_NAME\",\"name\":\"$GITHUB_REF_NAME\"}" "$api/releases" >/dev/null
          rid=$(curl -sf -H "Authorization: token $T" "$api/releases/tags/$GITHUB_REF_NAME" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          mkdir -p dist/linux
          # Collect whatever the bundler produced, wherever it landed --
          # CARGO_TARGET_DIR points outside the checkout (see "ensure rust"),
          # so search both roots explicitly rather than just `.`.
          find . "${CARGO_TARGET_DIR:-/nonexistent}" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.pkg.tar.zst' \) \
            -not -path '*/vendor/*' -exec cp -n {} dist/linux/ \; 2>/dev/null || true
          for f in dist/linux/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # Replace rather than duplicate: a retag re-runs this, and the
            # release otherwise accumulates one copy of each file per run.
            curl -sf -H "Authorization: token $T" "$api/releases/$rid/assets" \
              | python3 -c "import json,sys; [print(a['id']) for a in json.load(sys.stdin) if a['name']==sys.argv[1]]" "$name" \
              | while read -r old; do
                  curl -sf -X DELETE -H "Authorization: token $T" "$api/releases/$rid/assets/$old" >/dev/null && echo "replaced old $name ($old)"
                done
            curl -sf -X POST -H "Authorization: token $T" -F "attachment=@$f" "$api/releases/$rid/assets?name=$name" >/dev/null
            echo "attached $name"
          done
      - name: gather windows + mac artifacts for the website
        run: |
          T="${{ github.token }}"
          api="https://shithub.space/api/v1/repos/${{ github.repository }}"
          mkdir -p dist/windows dist/macos
          # Pull the windows assets the other lane attached.
          curl -sf -H "Authorization: token $T" "$api/releases/tags/$GITHUB_REF_NAME" | python3 -c "
          import json,sys
          for a in json.load(sys.stdin).get('assets',[]):
              n=a.get('name','')
              if n.endswith(('.exe','.msi','.zip')): print(a['browser_download_url'], n)" | while read -r url name; do
            curl -sfL -H "Authorization: token $T" -o "dist/windows/$name" "$url" && echo "fetched $name"
          done
          # If a locally-built mac dmg was staged on this runner, keep it.
          [ -n "${KRUST_MAC_DMG:-}" ] && [ -f "$KRUST_MAC_DMG" ] && cp "$KRUST_MAC_DMG" dist/macos/ || true
      - name: upload to derp.baby
        if: ${{ !contains(github.ref_name, '-test') }}
        run: ./tools/upload-krust-packages.sh
