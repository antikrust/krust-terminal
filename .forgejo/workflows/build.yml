# CI: compile-check Bork per platform on every push.
#
# Runs on the same self-hosted runners as bob3/snd (user-scope registration):
#   linux   -> host-mode runner on the PC
#   windows -> host-mode runner in the winbuild VM (VS 2022 build tools)
# macOS is intentionally absent: it's the local main build (no Forgejo mac runner).
#
# Checkout is plain git (no JS actions), matching bob3/snd, so the runners need
# only: git, a Rust toolchain (rustup), and Bork's system build deps
# (see script/{linux,windows}/install_build_deps). Rust is installed on demand
# below if missing. A full release build + bundling happens in release.yml on tags;
# here we only `cargo check` so per-push CI stays reasonably quick.
name: build
on: [push]

jobs:
  linux:
    runs-on: linux
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q https://x-access-token:${{ github.token }}@shithub.space/${{ github.repository }}.git ${{ github.sha }}
          git checkout -q --force FETCH_HEAD
      - name: install build deps
        run: |
          export BORK_SKIP_SUDO_PROMPT=1
          ./script/linux/install_build_deps
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH" || true
      - name: check
        run: |
          set -o pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          # The default target dir (under the act workdir, on the root disk)
          # has almost no headroom on this runner -- point cargo at the big
          # data disk instead.
          export CARGO_TARGET_DIR=/mnt/terra/forgejo-ci/cargo-target
          cargo check --bin bork --locked 2>&1 | tee /tmp/bork-check.log
      - name: report failure as an issue
        if: failure()
        run: |
          body=$(tail -c 60000 /tmp/bork-check.log | jq -Rs .)
          curl -sf -X POST -H "Authorization: token ${{ github.token }}" -H "Content-Type: application/json" \
            -d "{\"title\": \"CI failure: linux check @ ${{ github.sha }}\", \"body\": $body}" \
            "https://shithub.space/api/v1/repos/${{ github.repository }}/issues" || true

  windows:
    runs-on: windows
    defaults:
      run:
        shell: powershell
    steps:
      - name: free disk space
        run: |
          # Only one drive on this runner (C:, ~64G total) with no data disk
          # to redirect CARGO_TARGET_DIR to (unlike the linux runner's
          # /mnt/terra). Every past run's target dir sits under its own
          # hash-named act workdir and is never cleaned up, so stale ones
          # from earlier CI runs just accumulate. Reclaim that before it
          # starves the current run of space during LTO codegen.
          $ErrorActionPreference = 'Continue'
          Write-Output "--- C:\w ---"
          Get-ChildItem -Path "C:\w" -ErrorAction SilentlyContinue | Select-Object Name,LastWriteTime | Format-Table -AutoSize | Out-String -Width 200
          Write-Output "--- C:\w\.cache ---"
          Get-ChildItem -Path "C:\w\.cache" -ErrorAction SilentlyContinue | Select-Object Name,LastWriteTime | Format-Table -AutoSize | Out-String -Width 200
          Write-Output "--- C:\w\.cache\act ---"
          Get-ChildItem -Path "C:\w\.cache\act" -ErrorAction SilentlyContinue | Select-Object Name,LastWriteTime | Format-Table -AutoSize | Out-String -Width 200
          Write-Output "--- top-level dir sizes under C:\w (this can take a minute) ---"
          Get-ChildItem -Path "C:\w" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $size = (Get-ChildItem -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            [PSCustomObject]@{ Name = $_.FullName; SizeGB = [math]::Round($size / 1GB, 2) }
          } | Sort-Object SizeGB -Descending | Format-Table -AutoSize | Out-String -Width 200
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize | Out-String -Width 200
      - name: checkout
        run: |
          git init -q .
          git fetch -q https://x-access-token:${{ github.token }}@shithub.space/${{ github.repository }}.git ${{ github.sha }}
          git checkout -q --force FETCH_HEAD
      - name: install build deps
        run: |
          # cargo/rustup write routine progress to stderr; under this runner's
          # remoting model that gets wrapped as a terminating error (category
          # RemoteException) whenever $ErrorActionPreference is 'Stop' (which
          # the runner sets by default for every step). Rely on $LASTEXITCODE
          # instead, like the check step already does.
          $ErrorActionPreference = 'Continue'
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable
          }
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Needed for proto codegen in build.rs (prost-build). Mirrored under
          # our own infra rather than fetched from github.com/releases, same
          # reasoning as script/linux/install_build_deps.
          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://derp.baby/vendor/protoc-25.1-win64.zip" -OutFile protoc.zip -TimeoutSec 60
            Expand-Archive -Path protoc.zip -DestinationPath "$env:USERPROFILE\protoc" -Force
          }
          echo "$env:USERPROFILE\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: check
        run: |
          $ErrorActionPreference = 'Continue'
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo check --bin bork --locked 2>&1 | Tee-Object -FilePath check.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: report failure as an issue
        if: failure()
        run: |
          $tail = (Get-Content check.log -Tail 2000 -ErrorAction SilentlyContinue) -join "`n"
          $body = @{ title = "CI failure: windows check @ ${{ github.sha }}"; body = $tail } | ConvertTo-Json
          $headers = @{ Authorization = "token ${{ github.token }}"; "Content-Type" = "application/json" }
          try {
            Invoke-RestMethod -Method Post -Uri "https://shithub.space/api/v1/repos/${{ github.repository }}/issues" -Headers $headers -Body $body
          } catch {}
